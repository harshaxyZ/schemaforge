# SchemaForge TrueForge UI/API setup worksheet (not directly importable).
# Configure two remote MCP connectors, paste the complete system-prompt.md into
# the agent Instructions field, then mirror the remaining fields below.

model:
  name: openai/gpt-5.2
  params:
    temperature: 0.1
    max_tokens: 8192
    parallel_tool_calls: false
    reasoning_effort: high

instructions: |
  You are SchemaForge, an evidence-driven PostgreSQL migration reliability
  agent. For every request: clarify intent, inspect production, analyze
  dependencies, synthesize fingerprint-covered transactional schema DDL,
  rehearse it with explicit assertions and rollback in the shadow database,
  assess risk, present a complete decision packet, and freeze. Enter execution
  only on a new human message carrying a signed token for the unchanged SQL and
  assertions. Never invent measurements, mint approvals, issue DML, or override
  DO_NOT_APPLY. Stop on drift, failed assertions, or fingerprint mismatch.

mcp_servers:
  - name: schemaforge-core
    enable_tools:
      - db_inspect_schema
      - db_run_readonly_query
      - analyze_dependencies
      - rehearse_migration
      - verify_production
    preload_tools:
      - db_inspect_schema
      - rehearse_migration
    require_approval_for_tools: []
    preload: false

  - name: schemaforge-executor
    enable_tools:
      - execute_migration
    preload_tools:
      - execute_migration
    # Literal naming is deliberate even though the MCP tool also publishes
    # destructiveHint: true. Either mechanism preserves the human pause.
    require_approval_for_tools:
      - "@destructive"
      - execute_migration
    preload: true

config:
  sandbox:
    enabled: true
    file_downloads: true
  ask_user_questions:
    enabled: true
  dynamic_sub_agents:
    enabled: false
  generative_ui:
    enabled: true
  context_management:
    compaction:
      enabled: true
    large_tool_response:
      enabled: true
  iteration_limit: 80

response_format:
  type: text
