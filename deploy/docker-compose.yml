# SchemaForge deployment stack: two PostgreSQL targets, two role-separated MCP servers,
# and a Caddy HTTPS gateway. Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: schemaforge

x-mcp-image: &mcp-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: schemaforge-mcp:local
  restart: unless-stopped

services:
  prod:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schemaforge_prod
      POSTGRES_USER: sf_admin
      POSTGRES_PASSWORD: ${SF_ADMIN_DB_PASSWORD:?set SF_ADMIN_DB_PASSWORD in deploy/.env}
      SF_READER_DB_PASSWORD: ${SF_READER_DB_PASSWORD:?set SF_READER_DB_PASSWORD in deploy/.env}
      SF_EXECUTOR_DB_PASSWORD: ${SF_EXECUTOR_DB_PASSWORD:?set SF_EXECUTOR_DB_PASSWORD in deploy/.env}
    volumes:
      - prod-data:/var/lib/postgresql/data
      - ../docker/init-prod.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../shadow/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
      - ../shadow/seed-edge-cases.sql:/docker-entrypoint-initdb.d/03-seed-edge-cases.sql:ro
      - ./initdb/99-set-role-passwords.sh:/docker-entrypoint-initdb.d/99-set-role-passwords.sh:ro
    networks: [prod-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf_admin -d schemaforge_prod"]
      interval: 3s
      timeout: 3s
      retries: 30

  shadow:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schemaforge_shadow
      POSTGRES_USER: sf_shadow
      POSTGRES_PASSWORD: ${SF_SHADOW_DB_PASSWORD:?set SF_SHADOW_DB_PASSWORD in deploy/.env}
    volumes:
      - shadow-data:/var/lib/postgresql/data
      - ../docker/init-shadow.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../shadow/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
      - ../shadow/seed-edge-cases.sql:/docker-entrypoint-initdb.d/03-seed-edge-cases.sql:ro
    networks: [shadow-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf_shadow -d schemaforge_shadow"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Model-facing server: read-only production and the shadow sandbox. No write URL, no signing key.
  core:
    <<: *mcp-image
    environment:
      SF_PROCESS_ROLE: core
      SF_HTTP_HOST: 0.0.0.0
      SF_CORE_PORT: "3100"
      SF_PROD_READONLY_URL: postgresql://sf_reader:${SF_READER_DB_PASSWORD}@prod:5432/schemaforge_prod
      SF_SHADOW_URL: postgresql://sf_shadow:${SF_SHADOW_DB_PASSWORD}@shadow:5432/schemaforge_shadow
      SF_MCP_API_KEY: ${SF_CORE_MCP_API_KEY:?set SF_CORE_MCP_API_KEY in deploy/.env}
      SF_TARGET_ID: ${SF_TARGET_ID:-prod}
    depends_on:
      prod: { condition: service_healthy }
      shadow: { condition: service_healthy }
    networks: [prod-net, shadow-net, edge]
    healthcheck: &mcp-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.SF_CORE_PORT||process.env.SF_EXECUTOR_PORT)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Production writer: one destructive tool, signed approvals only. It cannot reach the shadow network.
  executor:
    <<: *mcp-image
    environment:
      SF_PROCESS_ROLE: executor
      SF_HTTP_HOST: 0.0.0.0
      SF_EXECUTOR_PORT: "3101"
      SF_PROD_READONLY_URL: postgresql://sf_reader:${SF_READER_DB_PASSWORD}@prod:5432/schemaforge_prod
      SF_PROD_WRITE_URL: postgresql://sf_executor:${SF_EXECUTOR_DB_PASSWORD}@prod:5432/schemaforge_prod
      SF_APPROVAL_SECRET: ${SF_APPROVAL_SECRET:?set SF_APPROVAL_SECRET in deploy/.env}
      SF_MCP_API_KEY: ${SF_EXECUTOR_MCP_API_KEY:?set SF_EXECUTOR_MCP_API_KEY in deploy/.env}
      SF_TARGET_ID: ${SF_TARGET_ID:-prod}
    depends_on:
      prod: { condition: service_healthy }
    networks: [prod-net, edge]
    healthcheck: *mcp-health

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SF_DOMAIN: ${SF_DOMAIN:?set SF_DOMAIN in deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      core: { condition: service_healthy }
      executor: { condition: service_healthy }
    networks: [edge]

volumes:
  prod-data:
  shadow-data:
  caddy-data:
  caddy-config:

networks:
  prod-net:
    internal: true
  shadow-net:
    internal: true
  edge:
