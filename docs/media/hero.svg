<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">SchemaForge decision packet</title>
  <desc id="d">Illustration of a SchemaForge run that refuses an unsafe migration and freezes a safe one for human approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <text x="80" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Rehearse. Prove. Stop.</text>
  <text x="80" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#c7d2fe">Every migration is tested on a shadow database before a human decides.</text>

  <!-- Left card: refusal -->
  <g font-family="Consolas, Menlo, monospace" font-size="19">
    <rect x="80" y="220" width="540" height="340" rx="18" fill="#0f172a" stroke="#dc2626" stroke-width="2"/>
    <circle cx="112" cy="252" r="7" fill="#ef4444"/><circle cx="136" cy="252" r="7" fill="#f59e0b"/><circle cx="160" cy="252" r="7" fill="#22c55e"/>
    <text x="190" y="258" fill="#94a3b8">users.email NOT NULL + UNIQUE</text>
    <text x="112" y="310" fill="#e2e8f0">inspect      baseline sha256 ok</text>
    <text x="112" y="345" fill="#e2e8f0">rehearse     shadow :5434</text>
    <text x="112" y="380" fill="#fca5a5">assert       14 NULL emails found</text>
    <text x="112" y="415" fill="#fca5a5">assert       3-row duplicate group</text>
    <text x="112" y="450" fill="#e2e8f0">rollback     confirmed</text>
    <rect x="112" y="480" width="300" height="48" rx="10" fill="#7f1d1d"/>
    <text x="132" y="512" fill="#fecaca" font-weight="700">DO_NOT_APPLY</text>
  </g>

  <!-- Right card: freeze -->
  <g font-family="Consolas, Menlo, monospace" font-size="19">
    <rect x="660" y="220" width="540" height="340" rx="18" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="692" cy="252" r="7" fill="#ef4444"/><circle cx="716" cy="252" r="7" fill="#f59e0b"/><circle cx="740" cy="252" r="7" fill="#22c55e"/>
    <text x="770" y="258" fill="#94a3b8">ADD COLUMN phone VARCHAR(32)</text>
    <text x="692" y="310" fill="#e2e8f0">rehearse     passed</text>
    <text x="692" y="345" fill="#86efac">assert       phone column exists</text>
    <text x="692" y="380" fill="#86efac">rollback     equivalent to baseline</text>
    <text x="692" y="415" fill="#e2e8f0">verdict      APPLY</text>
    <text x="692" y="450" fill="#e2e8f0">production   not touched</text>
    <rect x="692" y="480" width="400" height="48" rx="10" fill="#78350f"/>
    <text x="712" y="512" fill="#fde68a" font-weight="700">FROZEN · awaiting approval</text>
  </g>
</svg>
